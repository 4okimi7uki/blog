name: Preview Deploy

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Upload preview version
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Short SHA
        id: sha
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.event.pull_request.head.sha }}

      - name: Extract version ID
        id: version
        run: |
          echo "id=$(grep -oP 'Worker Version ID: \K[0-9a-f-]+' <<< "$OUTPUT")" >> "$GITHUB_OUTPUT"
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          message: |
            Deploy preview for _4okimi7uki blog_ ready!

            <table>
            <tr><td><strong>Project:</strong></td><td><code>4okimi7uki blog</code></td></tr>
            <tr><td><strong>Status:</strong></td><td>&nbsp;⛅️&nbsp; Deploy successful!</td></tr>
            <tr><td><strong>Preview URL:</strong></td><td><a href='${{ steps.deploy.outputs.deployment-url }}'>${{ steps.deploy.outputs.deployment-url }}</a></td></tr>
            <tr><td><strong>Latest Commit:</strong></td><td><code>${{ steps.sha.outputs.short }}</code></td></tr>
            </table>
