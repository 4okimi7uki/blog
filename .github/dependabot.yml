version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
